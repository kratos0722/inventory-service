spring.application.name=inventory-service

# PostgreSQL in production / docker-compose; overridable via environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventory}
spring.datasource.username=${DB_USERNAME:inventory}
spring.datasource.password=${DB_PASSWORD:inventory}

# Flyway owns the schema; Hibernate only maps to it (never mutates it).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
