# Tests run against in-memory H2 (PostgreSQL compatibility mode) so the suite
# is self-contained and needs no Docker. Hibernate creates the schema from the
# entities here; Flyway (which carries PostgreSQL-specific DDL) is disabled.
spring.datasource.url=jdbc:h2:mem:inventory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=20000
spring.datasource.username=sa
spring.datasource.password=

# Enough pooled connections for the concurrency test's worker threads.
spring.datasource.hikari.maximum-pool-size=24

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
